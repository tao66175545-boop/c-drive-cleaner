name: Publish Release

on:
  workflow_run:
    workflows: ["Validate C Drive Cleaner"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Decide whether this revision needs a release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content .\version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic version: $($manifest.version)"
          }

          $tag = "v$($manifest.version)"
          $releaseTags = @(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName |
            ConvertFrom-Json | ForEach-Object tagName)
          $alreadyPublished = $releaseTags -contains $tag

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
          "publish=$(-not $alreadyPublished)" >> $env:GITHUB_OUTPUT

      - name: Build release package
        if: steps.release.outputs.publish == 'True'
        shell: pwsh
        run: |
          $releaseDirectory = "$env:RUNNER_TEMP\release"
          .\tools\New-ReleasePackage.ps1 `
            -Version "${{ steps.release.outputs.version }}" `
            -OutputDirectory $releaseDirectory `
            -Repository "${{ github.repository }}" | Out-Null

          $notes = "RELEASE_NOTES_v${{ steps.release.outputs.version }}.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          Copy-Item -LiteralPath $notes -Destination "$releaseDirectory\RELEASE_NOTES.md" -Force

      - name: Upload verified release bundle
        if: steps.release.outputs.publish == 'True'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'True'
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release

      - name: Create immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem .\release -Filter '*.zip' | Select-Object -First 1
          if (-not $package) { throw 'Release package is missing.' }

          gh release create "${{ needs.build.outputs.tag }}" `
            $package.FullName `
            ".\release\SHA256SUMS.txt" `
            ".\release\release.json" `
            --repo "${{ github.repository }}" `
            --target "${{ github.event.workflow_run.head_sha }}" `
            --title "C盘智能清理 v${{ needs.build.outputs.version }}" `
            --notes-file ".\release\RELEASE_NOTES.md"
