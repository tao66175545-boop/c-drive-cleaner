name: Validate C Drive Cleaner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  powershell-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $files = @('C-Drive-Cleaner.ps1', 'C-Drive-Cleaner-UI.ps1', 'tools\New-ReleasePackage.ps1', 'tests\PlanContractTests.ps1', '.ui-smoke-test.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "Parse failed: $file" }
          }

      - name: Run safety self-test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\C-Drive-Cleaner.ps1 -SelfTest

      - name: Validate cleanup plan contract
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\PlanContractTests.ps1

      - name: Run UI smoke test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\.ui-smoke-test.ps1

      - name: Dry-run release package
        shell: powershell
        run: |
          $version = (Get-Content .\version.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $result = .\tools\New-ReleasePackage.ps1 -Version $version -OutputDirectory "$env:TEMP\c-drive-cleaner-release-test" -Repository "tao66175545-boop/c-drive-cleaner"
          if (-not (Test-Path -LiteralPath $result.PackagePath)) { throw "Package was not created." }
          if (-not (Test-Path -LiteralPath $result.ChecksumPath)) { throw "Checksum was not created." }
          if (-not (Test-Path -LiteralPath $result.ManifestPath)) { throw "Release manifest was not created." }
