name: Validate C Drive Cleaner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  powershell-validation:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify source fingerprint
        shell: powershell
        run: .\tools\Get-SourceManifest.ps1 -Verify

      - name: Enforce version policy
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .\tools\Test-VersionPolicy.ps1 -BaseCommit $env:BASE_SHA -Repository "${{ github.repository }}"

      - name: Run project validation suite
        shell: powershell
        run: .\tools\Invoke-ProjectValidation.ps1

      - name: Evaluate architecture loop gate
        shell: powershell
        run: .\tools\Invoke-ArchitectureLoop.ps1
